          command: |
            mkdir -p /tmp/mppigvbnhk
            { echo 'soqbmfpkxhhglljka'; echo 'bhldfmmaajyjibing'; } > /tmp/mppigvbnhk/tsastl
            du -h /tmp/mppigvbnhk/tsastl
